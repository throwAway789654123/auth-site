name: Deploy site

# Publie ./site sur GitHub Pages.
# L'URL résultante (https://<owner>.github.io/<repo>/) est publique et donc
# consommable par n'importe quelle autre CI via BASE_URL.
#
# Prérequis : Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy-site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - id: deployment
        uses: actions/deploy-pages@v4

      # Garde-fou : on vérifie que l'URL répond avant de déclarer le déploiement bon,
      # sinon la CI consommatrice partira sur une instance absente.
      - name: Smoke check
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Déployé sur $url"
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$url" || true)
            [ "$code" = "200" ] && exit 0
            echo "tentative $i : HTTP $code"
            sleep 6
          done
          echo "Le site ne répond pas en 200" >&2
          exit 1